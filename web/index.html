<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<meta name="description" content="Личный каталог фильмов и оценок">
<!-- сайт открывают только по ссылке: поисковикам индексировать запрещено -->
<meta name="robots" content="noindex, nofollow">
<title>Kinora</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5z"/></svg></span>
      <span class="logo-word">kinor<i>a</i></span>
    </div>

    <nav class="tabs" id="tabs">
      <span class="tab-ind"></span>
      <!-- на телефоне вкладки становятся нижней панелью: с иконками и короткими подписями -->
      <button data-view="all" class="on"><svg class="t-ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Каталог</span></button>
      <button data-view="fav"><svg class="t-ico" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg><span>Избранное</span></button>
      <button data-view="watch"><svg class="t-ico" viewBox="0 0 24 24"><path d="M6.5 4h11v16.5L12 16.8l-5.5 3.7z"/></svg><span class="t-full">Смотреть позже</span><span class="t-short">На потом</span></button>
      <button data-view="coll"><svg class="t-ico" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="12.5" rx="2.5"/><path d="M6.5 4.5h11"/></svg><span>Коллекции</span></button>
      <button data-view="stats"><svg class="t-ico" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Статистика</span></button>
    </nav>

    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Фильм, режиссёр, актёр, год…" autocomplete="off" spellcheck="false">
      <kbd>Ctrl K</kbd>
    </label>
    <button class="icon-btn" id="rouletteBtn" title="Что посмотреть? — случайный фильм"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle class="pt" cx="8.6" cy="8.6" r="1.4"/><circle class="pt" cx="12" cy="12" r="1.4"/><circle class="pt" cx="15.4" cy="15.4" r="1.4"/></svg></button>
    <button class="icon-btn" id="helpBtn" title="Как пользоваться Kinora — короткая экскурсия"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><circle class="pt" cx="12" cy="16.9" r=".9"/></svg></button>
    <button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
    <button class="btn accent" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
    <!-- на телефоне «Добавить», тема и «?» собраны в меню «Ещё» -->
    <button class="icon-btn" id="moreBtn" title="Ещё"><svg viewBox="0 0 24 24"><circle class="pt" cx="5.5" cy="12" r="1.6"/><circle class="pt" cx="12" cy="12" r="1.6"/><circle class="pt" cx="18.5" cy="12" r="1.6"/></svg></button>
  </header>

  <section class="hero" id="hero">
    <div class="hero-in">
      <div class="hero-text" id="heroText"></div>
      <div class="hero-poster" id="heroPoster"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <div class="main">
      <div class="dd-scrim" id="ddScrim"></div>
    <div class="toolbar" id="filters">
      <!-- на телефоне фильтры — панель снизу: заголовок, «Сбросить» и «Показать» -->
      <div class="m-sheet-h"><b>Фильтры</b><button class="m-reset" id="mFiltReset">Сбросить</button></div>
      <div class="tb-row">
        <div class="tiers" id="tiers"></div>
        <div class="dd" id="imdbDd">
          <button class="dd-btn" id="imdbBtn" title="Фильтр по рейтингу IMDb"><b class="dd-imdb">IMDb</b><span id="imdbLabel"></span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="dd-menu" id="imdbMenu" data-title="Рейтинг IMDb"></div>
        </div>
        <div class="dd" id="countryDd">
          <button class="dd-btn" id="countryBtn" title="Фильтр по стране"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5s1.3-6.1 3.9-8.5z"/></svg><span id="countryLabel">Страна</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="dd-menu" id="countryMenu" data-title="Страна"></div>
        </div>
        <div class="dd" id="sortDd">
          <button class="dd-btn" id="sortBtn"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg><span id="sortLabel"></span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="dd-menu" id="sortMenu" data-title="Сортировка"></div>
        </div>
      </div>
      <div class="genres-wrap">
        <div class="genres-box"><div class="genres" id="genres"></div></div>
        <div class="years" id="years">
          <div class="yr-label"><span id="yrText">Все годы</span><button id="yrReset" title="Сбросить годы">✕</button></div>
          <div class="yr-track"><div class="yr-fill"></div><input type="range" id="yrA" aria-label="Год от"><input type="range" id="yrB" aria-label="Год до"></div>
        </div>
      </div>
      <button class="btn accent m-done" id="mFiltDone">Показать</button>
    </div>

    <!-- телефон: на главном экране только «Фильтры», сортировка и лента жанров -->
    <div class="m-bar" id="mBar"><button class="dd-btn m-filt" id="mFilt"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Фильтры</span><b id="mFiltN" class="hidden"></b></button></div>

    <div class="sect-head" id="sectHead">
      <h2 id="sectTitle">Каталог</h2>
      <button class="person-chip hidden" id="personChip" title="Показать весь каталог"></button>
      <button class="reset-f hidden" id="resetF" title="Сбросить категорию, жанр, годы, страну и IMDb">✕ Сбросить фильтры</button>
      <div class="counter" id="counter"></div>
      <div class="sect-acts" id="sectActs"></div>
    </div>
    <p class="coll-desc hidden" id="collDesc"></p>
    <section id="colls" class="colls hidden"></section>

    <main id="grid" class="grid"></main>
    <div id="empty" class="empty hidden">
      <div class="empty-ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m7 6 3-3M17 6l-3-3M3 10h18"/></svg></div>
      <div class="empty-t" id="emptyT">Ничего не нашлось</div>
      <div class="empty-s" id="emptyS">Попробуйте другой запрос или сбросьте фильтры</div>
    </div>
    <section id="stats" class="stats hidden"></section>
  </div>

  <div id="detail" class="modal"></div>
  <div id="roulette" class="modal"></div>
  <div id="editor" class="modal"></div>
  <div id="share" class="modal"></div>
  <div id="tour" class="tour"></div>
  <div id="helpTip" class="help-tip"></div>
  <button class="up-btn" id="upBtn" title="Наверх"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
  <div class="msheet" id="moreSheet"><div class="msheet-scrim"></div>
    <div class="msheet-in"><div class="msheet-h">Ещё</div>
      <button data-more="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Добавить свой фильм<small>По ссылке на Кинопоиск, IMDb или Википедию</small></span></button>
      <button data-more="theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span id="moreTheme">Светлая тема</span></button>
      <button data-more="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/></svg><span>Как пользоваться<small>Короткая экскурсия по Kinora</small></span></button>
    </div></div>
  <div id="toasts"></div>
  <div id="achPops"></div>
  <script src="app.js"></script>
</body>
</html>
